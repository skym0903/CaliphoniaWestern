<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caliphonia">
<meta name="theme-color" content="#151413">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
/* stop iPad double-tap zoom and text selection on buttons */
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
</style>
<title>Caliphonia Ordering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen iPad app. Red/black/white from the Caliphonia sign. Guest screens use large type for older diners. Single light theme on purpose (matches the storefront). */
:root{
  --paper:#ffffff; --ground:#f4f2ef; --ink:#151413; --ink-2:#55504c; --line:#e2ddd8;
  --red:#e01414; --red-dark:#b30d0d; --red-soft:#fde8e6; --jade-soft:#e3f4ea; --amber-soft:#fdf1dc;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Inter","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
body.ko .t-main,body.ko .g-ko{font-family:var(--ko)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* Staff bar */
.staffbar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.staffbar .brand{font-family:var(--display);font-size:24px;letter-spacing:.04em;line-height:1}
.staffbar .brand b{color:var(--red);font-weight:400}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;color:#cfc9c4}
.tabs button[aria-current="true"]{background:#fff;color:var(--ink)}
body.ko .tabs,body.ko .pad,body.ko .demo-note,body.ko .modal,body.ko .pinwrap h2,body.ko .pinwrap .ctx,body.ko .toast{font-family:var(--ko)}
body.ko h1.v{font-family:var(--ko);font-weight:800;font-size:30px;letter-spacing:0}
.slang{display:flex;border:1px solid #4a4542;border-radius:9px;overflow:hidden;flex:none}
.slang button{padding:8px 11px;font-size:13px;font-weight:700;color:#cfc9c4}
.slang button[aria-pressed="true"]{background:var(--red);color:#fff}
.tabs .badge{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px}
.demo-note{background:var(--amber-soft);color:#6b4100;font-size:13px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{flex:1;min-height:0;overflow:auto}
.pad{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1.v{font-family:var(--display);font-size:34px;letter-spacing:.03em;font-weight:400;line-height:1;margin:0}
.sub{color:var(--ink-2);font-size:14px;margin:6px 0 0}
.btn{padding:12px 18px;border-radius:10px;font-weight:600;background:var(--paper);border:1px solid var(--line)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:active{background:var(--red-dark)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}

/* Table map: a drawn floor plan. Large, high-contrast type to match the guest menu. */
.tables h1.v{font-size:52px}
body.ko .tables h1.v{font-size:38px}
.lead{font-size:19px;color:var(--ink-2);margin:8px 0 0;line-height:1.4}
.maphead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.tables .layoutset{font-size:15px;font-weight:600}
.tables .seg button{padding:11px 16px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 auto 16px;max-width:min(1060px,calc((100vh - 340px) * 1.6))}
.lchip{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:16px;font-weight:600}
.lchip i{width:18px;height:18px;border-radius:6px;border:2.5px solid var(--ink);background:var(--paper)}
.lchip.k i{background:var(--red);border-color:var(--red)}
.lchip.p i{background:var(--ink)}
.lchip b{font-variant-numeric:tabular-nums;min-width:26px;padding:2px 8px;border-radius:999px;background:var(--ground);text-align:center;font-size:14px}
.movebar{max-width:min(1060px,calc((100vh - 340px) * 1.6));margin:0 auto 14px;background:var(--amber-soft);color:#6b4100;border-radius:14px;padding:14px 18px;font-size:18px;font-weight:700}
.floor{--tile:#efebe6;container-type:inline-size;position:relative;width:100%;max-width:min(1060px,calc((100vh - 340px) * 1.6));aspect-ratio:16/10;margin:0 auto;border:3px solid var(--ink);border-radius:20px;
  background-color:var(--paper);background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:6.25% 10%;background-position:-1px -1px}
.floor .kitchen{position:absolute;right:0;top:0;width:19%;height:36%;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);border-radius:0 17px 0 14px;
  background:repeating-linear-gradient(135deg,#f4f2ef 0 10px,#ebe6e0 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px}
.floor .kitchen svg{width:34%;height:auto}
.floor .kitchen b{font-size:clamp(11px,1.25vw,15px);letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.floor .entry{position:absolute;bottom:-3px;left:43%;width:14%;height:3px;background:var(--paper)}
.floor .entry svg{position:absolute;left:0;bottom:3px;width:100%;height:auto;overflow:visible}
.floor .entry span{position:absolute;bottom:10px;left:56%;font-size:clamp(11px,1.25vw,15px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.floor .tag{position:absolute;left:21%;bottom:14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--amber-soft);color:#6b4100;padding:6px 12px;border-radius:999px}
.tbl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35cqw;padding:0;border-radius:14px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:0 4px 0 rgba(21,20,19,.14);transition:transform .12s}
.tbl .n{font-family:var(--display);font-size:clamp(30px,3.9vw,50px);font-size:4.6cqw;line-height:.86;padding-top:.08em;font-variant-numeric:tabular-nums}
.tbl .st{font-size:clamp(13px,1.6vw,19px);font-size:2.05cqw;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);line-height:1.1;text-align:center;padding:0 4px;white-space:nowrap}
.tbl:not(.round)::before,.tbl:not(.round)::after{content:"";position:absolute;left:20%;right:20%;height:8px;border-radius:5px;background:#d6cfc7}
.tbl:not(.round)::before{top:-15px}
.tbl:not(.round)::after{bottom:-15px}
.tbl.round{border-radius:50%}
.tbl.round::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:6px dotted #d6cfc7;pointer-events:none}
.tbl.busy{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
.tbl.busy .st{color:#fff}
.tbl.pay{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 4px 0 #000}
.tbl.pay .st{color:#e6e0db}
.tbl:active{transform:translate(-50%,-50%) translateY(3px);box-shadow:0 1px 0 rgba(21,20,19,.14)}
.note{text-align:center;font-size:16px;color:var(--ink-2);margin:18px 0 0}

/* ---------- Guest menu: large type ---------- */
.menu{display:grid;grid-template-columns:210px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%;min-height:0;background:var(--paper)}
.gbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.gbar .logo{width:150px;flex:none}
.gbar .logo img{display:block;width:100%;height:auto}
.tblbadge{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:14px;padding:6px 8px 6px 18px}
.tblbadge .lbl{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#cfc9c4}
.tblbadge .n{font-family:var(--display);font-size:46px;line-height:1;letter-spacing:.02em}
.tblbadge .chg{font-size:13px;font-weight:600;color:#cfc9c4;border:1px solid #4a4542;border-radius:10px;padding:10px 12px}
.lang{margin-left:auto;display:flex;border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.lang button{padding:14px 26px;font-size:22px;font-weight:800;min-width:120px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.rail{border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
.cats{display:flex;flex-direction:column;gap:4px;padding:14px 10px;overflow:auto}
.cats button{text-align:left;padding:16px 14px;border-radius:12px;font-weight:700;font-size:22px;line-height:1.2}
.cats button[aria-current="true"]{background:var(--ink);color:#fff}
.items{overflow:auto;min-height:0;padding:22px 22px 40px;container-type:inline-size;container-name:items}
.items h2{font-family:var(--display);font-weight:400;font-size:52px;letter-spacing:.03em;line-height:1;margin:0 0 6px}
body.ko .items h2{font-family:var(--ko);font-weight:800;font-size:38px;letter-spacing:0}
.items .h2sub{color:var(--ink-2);font-size:18px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* Columns follow the space the menu really has: 3 only when each card can be at least ~215px wide, so smaller iPads get 2 roomy columns instead of 3 squeezed ones. */
@container items (max-width:700px){.grid.c3{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .grid.c3 .card .body{padding:14px 16px 16px}.grid.c3 .card .t-main{font-size:24px}.grid.c3 .card .t-alt{font-size:17px}.grid.c3 .card .price{font-size:24px}}
@container items (max-width:440px){.grid,.grid.c3{grid-template-columns:minmax(0,1fr)}}
.grid.c3 .card .body{padding:12px 12px 14px}
.grid.c3 .card .t-main{font-size:21px}
.grid.c3 .card .t-alt{font-size:15px}
.grid.c3 .card .price{font-size:21px}
.grid.c3 .card .add{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%}
.grid.c3 .card .add b{font-size:32px}
.grid.c3 .card .add .al{display:none}
.t-main,.t-alt,.nm,.go,.chip,.cats button,.sheet h3{word-break:keep-all;overflow-wrap:break-word}
.layoutset{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{padding:9px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .ic{display:grid;gap:2px}
.seg .ic i{display:block;width:6px;height:10px;border-radius:1px;background:currentColor}
.card{position:relative;display:flex;flex-direction:column;text-align:left;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper)}
.card .art{aspect-ratio:16/9;max-width:100%;background:var(--ground);display:grid;place-items:center;position:relative}
.card .art svg{width:34%;height:auto}
.card .art .ph{position:absolute;left:10px;bottom:6px;font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t-main{font-weight:800;font-size:24px;line-height:1.2;text-wrap:balance}
.card .t-alt{font-size:17px;color:var(--ink-2);line-height:1.3}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.card .price{font-weight:800;font-size:24px}
.card .add{height:52px;padding:0 18px;border-radius:26px;background:var(--red);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px}
.card .add b{font-size:28px;line-height:1;font-weight:600}
.card .qtybadge{position:absolute;top:10px;right:10px;min-width:40px;height:40px;padding:0 10px;border-radius:20px;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center;font-size:20px}
.card.in{border-color:var(--ink)}
.cart{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--ground)}
.cart h3{font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.03em;margin:0;padding:20px 18px 10px;line-height:1}
body.ko .cart h3{font-family:var(--ko);font-weight:800;font-size:28px;letter-spacing:0}
.lines{flex:1;overflow:auto;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.line{background:var(--paper);border-radius:14px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:start}
.line .nm{font-weight:800;font-size:20px;line-height:1.25}
.line .nm small{display:block;font-weight:500;color:var(--ink-2);font-size:15px;margin-top:2px}
.line .opts{grid-column:1/-1;font-size:16px;line-height:1.4;color:var(--red-dark);font-weight:600}
.line .lp{font-weight:800;font-size:20px;text-align:right}
.step{display:flex;align-items:center;gap:6px;grid-column:1/-1;flex-wrap:wrap}
.step button.q{width:50px;height:50px;border-radius:12px;border:2px solid var(--line);font-size:26px;font-weight:700;background:var(--paper)}
.step span{min-width:36px;text-align:center;font-weight:800;font-size:22px}
.step .tx{margin-left:auto;height:50px;padding:0 12px;font-size:16px;font-weight:700;border-radius:12px;color:var(--ink)}
.step .tx.edit{border:2px solid var(--ink)}
.step .tx.edit+.tx.rm{margin-left:0}
.step .tx.rm{color:var(--ink-2)}
.empty{color:var(--ink-2);text-align:center;padding:40px 16px;font-size:15px;line-height:1.5}
.cart .empty{font-size:19px;line-height:1.55;padding:30px 10px}
.total{padding:16px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:26px}
.total small{display:block;font-weight:500;font-size:14px;color:var(--ink-2)}
.go{margin:0 14px 14px;padding:16px 14px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:3px}
.go .gm{font-size:26px;font-weight:800;line-height:1.15}
.go .gs{font-size:15px;font-weight:500;opacity:.92}
.mobilecart{display:none}

/* Dish sheet (options) */
.sheet-scrim{position:fixed;inset:0;background:rgba(21,20,19,.6);display:grid;place-items:center;padding:20px;z-index:20}
.sheet{background:var(--paper);border-radius:22px;width:100%;max-width:640px;max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.sheet .top{display:flex;gap:16px;align-items:flex-start;padding:24px 24px 10px}
.sheet .top .tt{flex:1;min-width:0}
.sheet .top h3{margin:0;font-size:34px;font-weight:800;line-height:1.15;text-wrap:balance}
.sheet .top p{margin:4px 0 0;font-size:19px;color:var(--ink-2)}
.sheet .top .pr{font-size:28px;font-weight:800}
.sheet .close{width:54px;height:54px;border-radius:50%;background:var(--ground);font-size:28px;line-height:1;flex:none}
.sheet .scroll{overflow:auto;padding:6px 24px 10px}
.grp{margin-top:18px}
.grp h4{margin:0 0 10px;font-size:22px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp h4 small{font-size:16px;font-weight:500;color:var(--ink-2)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.chip{min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);text-align:left;font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px;line-height:1.2}
.chip .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink-2);flex:none;display:grid;place-items:center;font-size:18px;color:#fff}
.chip.one .box{border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chip[aria-pressed="true"] .box{border-color:#fff;background:var(--red)}
.chip.out[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red-dark)}
.chip.out[aria-pressed="true"] .box{border-color:var(--red);background:var(--red)}
.qtyrow{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.qtyrow b{font-size:22px}
.qtyrow .q{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);font-size:32px;font-weight:700}
.qtyrow span{min-width:48px;text-align:center;font-size:30px;font-weight:800}
.sheet .foot{padding:16px 24px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sheet .foot .btn{padding:18px 20px;font-size:20px;border-radius:16px;font-weight:800}
.sheet .foot .primary{flex:1 1 260px}
.samplenote{font-size:13px;color:#6b4100;background:var(--amber-soft);padding:6px 10px;border-radius:8px;margin-top:16px;display:inline-block}

/* Lock + PIN */
.lock{height:100%;display:grid;place-items:center;background:var(--ink);color:#fff;text-align:center;padding:24px}
.lock .big{font-family:var(--display);font-size:76px;letter-spacing:.03em;line-height:1;margin:0;font-weight:400}
.lock .bigko{font-family:var(--ko);font-weight:800;font-size:40px;margin:10px 0 0}
.lock .msg{color:#fff;font-size:28px;font-weight:700;margin:30px 0 0;line-height:1.4}
.lock .msgko{font-family:var(--ko);color:#d8d2cd;font-size:24px;font-weight:500;margin:8px 0 0;line-height:1.4}
.lock .bowl{width:130px;margin:0 auto 26px}
.lock .staff{margin-top:56px;color:#8a837e;border:1px solid #3b3734;padding:10px 18px;border-radius:10px;font-size:14px}
.lock .back{display:block;margin:18px auto 0;color:#d8d2cd;font-size:18px;font-weight:600;text-decoration:underline;text-underline-offset:4px;padding:10px}
.pinwrap{width:100%;max-width:340px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.pinwrap .wm{font-family:var(--display);font-size:30px;letter-spacing:.06em;line-height:1;color:#fff}
.pinwrap .wm b{color:var(--red);font-weight:400}
.pinwrap .ctx{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:6px 14px;border-radius:20px;background:#2a2725;color:#d8d2cd;font-size:14px;font-weight:600}
.pinwrap .ctx i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.pinwrap h2{margin:14px 0 0;font-size:26px;font-weight:700;color:#fff}
.dots{display:flex;justify-content:center;gap:18px;margin:26px 0 8px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #6f6964;transition:background .12s,border-color .12s}
.dots i.on{background:#fff;border-color:#fff}
.dots.err i{border-color:var(--red);background:var(--red)}
.dots.err{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pinerr{color:#ff8a80;min-height:22px;font-size:15px;font-weight:600;margin-bottom:14px}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:16px 24px;justify-content:center}
.keys button{width:84px;height:84px;border-radius:50%;border:1.5px solid #3b3734;color:#fff;font-size:34px;font-weight:500;display:grid;place-items:center;transition:background .1s}
.keys button:active{background:#3b3734}
.keys button.fn{border-color:transparent;font-size:16px;font-weight:600;color:#bdb6b0}
.keys button.fn svg{width:30px;height:30px}
@media (max-width:560px){.keys{grid-template-columns:repeat(3,72px);gap:12px 20px}.keys button{width:72px;height:72px;font-size:30px}}

/* Confirm */
.confirm{max-width:780px;margin:0 auto}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .copts{color:var(--red-dark);font-weight:600;font-size:14px;margin-top:3px}
.crow .step{grid-column:auto;flex-wrap:nowrap}
.crow .step button.q{width:42px;height:42px;font-size:22px}
.crow .step span{font-size:18px}
.crow .step .tx{height:42px;font-size:14px;margin-left:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions .grow{flex:1}
.actions .send{flex:1 1 260px;padding:18px;font-size:18px}

/* Station */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ticket.new{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.ticket header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px 8px;background:var(--ink);color:#fff}
.ticket header .tt{display:flex;align-items:baseline;gap:10px}
.ticket header .tl{font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#cfc9c4}
.ticket header .tt b{font-family:var(--display);font-weight:400;font-size:60px;line-height:.9;letter-spacing:.01em}
.ticket header .meta{text-align:right;font-size:14px;color:#cfc9c4;line-height:1.35}
.ticket header .meta b{font-size:16px;color:#fff;font-weight:700}
.ticket ul{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.ticket li{display:grid;grid-template-columns:34px minmax(0,1fr);font-size:15px;line-height:1.3}
.ticket li b{font-size:17px}
.ticket li small{display:block;color:var(--ink-2);font-family:var(--ko);font-size:13px}
.ticket li em{display:block;font-style:normal;font-weight:700;color:var(--red-dark);font-size:14px}
.ticket .tf{display:flex;gap:8px;padding:10px 14px 14px;margin-top:auto}
.ticket .tf .btn{flex:1;padding:11px 8px;font-size:14px}
.ticket .tf3{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ticket .tf3 .btn{flex:none;padding:0 12px;min-height:56px}
.ticket .tf3 .tcx{padding:0 14px;font-size:13px}
.ticket .tf3 .tdone{grid-column:1/-1;justify-self:center;width:70%;margin-top:10px;padding:15px 12px;font-size:17px;font-weight:700}
.ticket .tf3 .tcx{color:var(--red-dark);border-color:var(--red-dark)}
.ticket .tf3 .tcx:active{background:var(--red-soft)}
.btn.danger{background:var(--red-dark);color:#fff;border-color:var(--red-dark)}
.cmodal h3{font-size:20px;line-height:1.3}
.citems{font-size:15px;font-weight:600;margin:4px 0 12px;line-height:1.4}
.cwarn{background:var(--red-soft);color:var(--red-dark);font-weight:700;font-size:14px;padding:10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.4}
.rq{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.rchip{padding:10px 12px;border-radius:20px;border:1px solid var(--line);font-size:14px;font-weight:600}
.rchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cx td{color:var(--ink-2)}
.sttabs{display:flex;gap:6px;margin:18px 0 4px;border-bottom:2px solid var(--line)}
.sttabs button{padding:12px 16px;font-size:16px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px}
.sttabs button span{display:inline-block;min-width:24px;padding:1px 7px;margin-left:6px;border-radius:12px;background:var(--line);color:var(--ink);font-size:13px}
.sttabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.sttabs button[aria-selected="true"] span{background:var(--red);color:#fff}
.taxbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0;font-size:14px;color:var(--ink-2)}
.taxbar.warn{background:var(--amber-soft);color:#6b4100;padding:12px 14px;border-radius:12px}
.taxbar.warn>span{flex-basis:100%;font-weight:600}
.taxbar input{font:inherit;width:110px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.ticket.check li.cl{grid-template-columns:34px minmax(0,1fr) auto;gap:6px}
.sums{padding:4px 14px 10px;border-top:1px dashed var(--line);margin-top:4px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.sums div{display:flex;justify-content:space-between}
.sums .tot{font-size:20px;font-weight:800;padding-top:4px}
.paybtns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.paybtns .btn{min-height:56px;font-size:16px;font-weight:700}
.bigtotal{font-family:var(--display);font-size:56px;line-height:1;margin:6px 0 12px}
.paper80 .row2{display:flex;justify-content:space-between;gap:8px}
.paper80 .row2.big{font-size:18px;font-weight:700}
.kpi.alert{border-color:var(--red);background:var(--red-soft)}
.age{font-size:12px;color:var(--ink-2);padding:0 14px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.pill.printed{background:var(--jade-soft);color:#1d6b3b}
.pill.wait{background:var(--red-soft);color:var(--red-dark)}
.sect{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.sect h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:var(--ink-2)}

/* Report */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--ground)}
td.r,th.r{text-align:right}
td .o{color:var(--red-dark);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--red);margin-top:5px}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}

/* Ticket modal + toast */
.scrim{position:fixed;inset:0;background:rgba(21,20,19,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal{background:var(--paper);border-radius:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{color:var(--ink-2);font-size:14px;line-height:1.5;margin:0 0 14px}
.paper80{background:#fff;color:#000;border:1px dashed #bbb;margin:0 auto 14px;width:100%;max-width:302px;padding:16px 14px;font-family:var(--mono);font-size:13px;line-height:1.45}
.paper80 .c{text-align:center}
.paper80 .big{font-size:22px;font-weight:700}
.paper80 hr{border:0;border-top:1px dashed #000;margin:8px 0}
.paper80 .ko{font-family:var(--ko);font-size:12px;padding-left:28px}
.paper80 .op{padding-left:28px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

@media (max-width:1060px){
  .menu{grid-template-columns:180px minmax(0,1fr)}
  .gbar .logo{width:110px}
  .cart{display:none}
  .mobilecart{display:flex;position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:#fff;align-items:center;gap:12px;z-index:5}
  .mobilecart .sum{font-size:20px;font-weight:700}
  .mobilecart .go{margin:0 0 0 auto;padding:12px 22px}
  .mobilecart .go .gm{font-size:22px}
  .items{padding-bottom:130px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .menu{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .gbar{gap:10px}
  .gbar .logo{display:none}
  .tblbadge .n{font-size:36px}
  .lang button{padding:10px 14px;font-size:17px;min-width:0}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .cats{flex-direction:row;overflow-x:auto;padding:6px 10px}
  .cats button{white-space:nowrap;padding:10px 12px;font-size:18px}
  .grid,.grid.c3{grid-template-columns:minmax(0,1fr)}
  .items{padding:14px 12px 130px}
  .items h2{font-size:40px}
  .tabs button{padding:8px 10px;font-size:13px}
  .lock .big{font-size:52px}
  .lock .msg{font-size:22px}
  .sheet .top h3{font-size:26px}
  .mobilecart .go .gs{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function p2(n){return (n<10?"0":"")+n;}
function dayOf(ts){var d=new Date(ts);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function money(n){return "$"+n.toFixed(2);}
function hm(ts){var d=new Date(ts),h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+":"+p2(m)+(h<12?" AM":" PM");}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function L(k){return T[S.lang][k];}
function nm(m){return S.lang==="ko"?m.ko:m.en;}
function alt(m){return S.lang==="ko"?m.en:m.ko;}
function cartCount(){return S.cart.reduce(function(a,l){return a+l.qty;},0);}
function linesTotal(lines){return lines.reduce(function(a,l){return a+(BY[l.id]?BY[l.id].price*l.qty:0);},0);}
function qtyOf(id){return S.cart.filter(function(l){return l.id===id;}).reduce(function(a,l){return a+l.qty;},0);}
function openOrders(){return orders().filter(function(o){return o.status==="sent";});}
function unpaidOrders(){return orders().filter(function(o){return o.status!=="cancelled"&&o.status!=="merged"&&!o.check;});}
/* table -> "kitchen" (food still cooking) or "pay" (all served, waiting to pay). Closing the check clears it. */
function busyTables(){var b={};unpaidOrders().forEach(function(o){if(o.status==="sent")b[o.table]="kitchen";else if(!b[o.table])b[o.table]="pay";});return b;}
function taxFor(sub){return S.taxRate==null?0:Math.round(sub*S.taxRate)/100;}

function defaultOpts(id){var o={};optsFor(id).forEach(function(g){o[g.id]=g.type==="one"?g.def:[];});return o;}
function keyOf(id,opts){var parts=[id];optsFor(id).forEach(function(g){var v=opts[g.id];parts.push(g.id+"="+(Array.isArray(v)?v.slice().sort().join("+"):v));});return parts.join("|");}
/* Readable changes only (defaults are not shown). */
function optText(id,opts,lang){
  var out=[];if(!opts)return out;
  optsFor(id).forEach(function(g){
    var v=opts[g.id];
    function find(x){return g.choices.filter(function(c){return c.id===x;})[0];}
    if(g.type==="one"){if(v&&v!==g.def){var c=find(v);if(c)out.push(c[lang]);}}
    else if(v&&v.length){
      var names=v.map(function(x){var c=find(x);return c?(lang==="ko"?c.ko:c.en.toLowerCase()):x;}).join(", ");
      out.push(lang==="ko"?names+" 빼기":"No "+names);
    }
  });
  return out;
}

  return '<div class="scrim" data-act="closecheckprint"><div class="modal" role="dialog" aria-modal="true" aria-label="'+t("checkTitle")+'">'+
    '<h3>'+t("checkTitle")+'</h3><p>'+t("checkNote")+'</p>'+
    '<div class="paper80"><div class="c big">CALIPHONIA</div><div class="c">425 S Western Ave, Los Angeles</div><div class="c">TABLE '+tb+' · '+new Date().toLocaleDateString()+' '+hm(Date.now())+'</div><hr>'+lines+'<hr>'+
    '<div class="row2"><span>Subtotal</span><span>'+money(sub)+'</span></div><div class="row2"><span>Tax'+(S.taxRate==null?' (not set)':' '+S.taxRate+'%')+'</span><span>'+money(tax)+'</span></div>'+
    '<div class="row2 big"><span>TOTAL</span><span>'+money(sub+tax)+'</span></div><hr><div class="c">Thank you! 감사합니다!</div></div>'+
    '<div class="actions" style="margin-top:0"><button class="btn grow" data-act="closecheckprint">'+t("close")+'</button></div></div></div>';
}

function vReport(){
  var day=S.date;
  var list=orders().filter(function(o){return dayOf(o.sentAt)===day&&o.status!=="cancelled"&&o.status!=="merged";}).sort(function(a,b){return a.sentAt-b.sentAt;});
  var counts={},itemsSold=0,sales=0;
  list.forEach(function(o){o.items.forEach(function(l){counts[l.id]=(counts[l.id]||0)+l.qty;itemsSold+=l.qty;sales+=(BY[l.id]?BY[l.id].price:0)*l.qty;});});
  var ranked=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  var max=ranked.length?counts[ranked[0]]:1;
  var h='<div class="pad"><div class="maphead"><div><h1 class="v">'+t("report")+'</h1><p class="sub">'+t("rSub")+'</p></div>'+
    '<div class="datebar"><label for="rdate" class="sub" style="margin:0">'+t("day")+'</label><input type="date" id="rdate" value="'+day+'"><button class="btn" data-act="today">'+t("today")+'</button></div></div>';
  h+='<div class="kpis"><div class="kpi"><span>'+t("orders")+'</span><b class="num">'+list.length+'</b></div><div class="kpi"><span>'+t("itemsSold")+'</span><b class="num">'+itemsSold+'</b></div>'+
    '<div class="kpi"><span>'+t("sales")+'</span><b class="num">'+money(sales)+'</b></div><div class="kpi"><span>'+t("avg")+'</span><b class="num">'+money(list.length?sales/list.length:0)+'</b></div></div>';
  var cc=closedChecks(day),card=0,cash=0,taxc=0;cc.forEach(function(c){if(c.method==="card")card+=c.total;else cash+=c.total;taxc+=c.tax;});
  var unpaid=list.filter(function(o){return !o.check;}).reduce(function(a,o){return a+linesTotal(o.items);},0);
  h+='<div class="sect" style="margin-top:4px"><h2>'+t("payments")+'</h2></div><div class="kpis"><div class="kpi"><span>'+t("cardSales")+'</span><b class="num">'+money(card)+'</b></div><div class="kpi"><span>'+t("cashSales")+'</span><b class="num">'+money(cash)+'</b></div>'+
    '<div class="kpi"><span>'+t("taxCollected")+'</span><b class="num">'+money(taxc)+'</b></div><div class="kpi'+(unpaid>0?' alert':'')+'"><span>'+t("unpaid")+'</span><b class="num">'+money(unpaid)+'</b></div></div>';
  if(!list.length){
    h+='<div class="panel"><div class="empty">'+t("rEmpty")+(day===today()?'<br><br><button class="btn" data-act="sample">'+t("trySamples")+'</button>':'')+'</div></div>'+cancelledSection(day)+'</div>';
    return h;
  }
  h+='<div class="two"><div class="panel"><div class="tablewrap"><table><thead><tr><th>'+t("dish")+'</th><th class="r">'+t("sold")+'</th><th class="r">'+t("salesCol")+'</th></tr></thead><tbody>';
  ranked.forEach(function(id){var m=BY[id]||{en:id,ko:id,price:0};
    h+='<tr><td>'+esc(snm(m))+'<div class="bar" style="width:'+Math.max(4,counts[id]/max*100)+'%"></div></td><td class="r num">'+counts[id]+'</td><td class="r num">'+money(m.price*counts[id])+'</td></tr>';});
  h+='</tbody></table></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>#</th><th>'+t("time")+'</th><th>'+t("table")+'</th><th>'+t("items")+'</th><th>'+t("payCol")+'</th><th class="r">'+t("total")+'</th></tr></thead><tbody>';
  list.forEach(function(o){
    h+='<tr><td class="num">'+o.num+'</td><td class="num" style="white-space:nowrap">'+hm(o.sentAt)+'</td><td class="num">'+o.table+'</td><td>'+
      o.items.map(function(l){var op=optText(l.id,l.opts,S.staffLang);return l.qty+'× '+esc(snm(BY[l.id]||{en:l.id,ko:l.id}))+(op.length?' <span class="o">('+esc(op.join(", "))+')</span>':'');}).join("<br>")+'</td><td>'+(o.check?t(o.check.method):'<span class="pill wait">'+t("unpaid")+'</span>')+'</td><td class="r num">'+money(linesTotal(o.items))+'</td></tr>';});
  h+='</tbody></table></div></div></div>'+cancelledSection(day);
  if(list.some(function(o){return o.sample;})) h+='<div class="actions"><button class="btn ghost" data-act="clearsample">'+t("removeSamples")+'</button></div>';
  return h+'</div>';
}

function vTicketModal(){
  var o=orders().filter(function(x){return x.id===S.ticket;})[0];if(!o){S.ticket=null;return "";}
  var lines="";o.items.forEach(function(l){var m=BY[l.id]||{en:l.id,ko:""};
    lines+='<div>'+l.qty+' x '+esc(m.en)+'</div><div class="ko">'+esc(m.ko)+'</div>';
    var en=optText(l.id,l.opts,"en"),ko=optText(l.id,l.opts,"ko");
    en.forEach(function(x,i){lines+='<div class="op">** '+esc(x.toUpperCase())+'</div><div class="ko" style="font-weight:700">'+esc(ko[i]||"")+'</div>';});});
  return '<div class="scrim" data-act="closeticket"><div class="modal" role="dialog" aria-modal="true" aria-label="'+t("ticket")+'">'+
    '<h3>'+t("ticket")+'</h3><p>'+t("ticketNote")+'</p>'+
    '<div class="paper80">'+'<div class="c big">ORDER #'+o.num+'</div><div class="c">TABLE '+o.table+'</div><div class="c">'+new Date(o.sentAt).toLocaleDateString()+' '+hm(o.sentAt)+'</div><hr>'+lines+'<hr><div>Items: '+o.items.reduce(function(a,l){return a+l.qty;},0)+'</div></div>'+
    '<div class="actions" style="margin-top:0"><button class="btn" data-act="closeticket">'+t("close")+'</button><button class="btn primary grow" data-act="markprinted" data-v="'+o.id+'">'+t("markPrinted")+'</button></div></div></div>';
}

function cancelledSection(day){
  var cx=orders().filter(function(o){return o.status==="cancelled"&&dayOf(o.sentAt)===day;}).sort(function(a,b){return a.sentAt-b.sentAt;});
  if(!cx.length)return "";
  var sum=cx.reduce(function(a,o){return a+linesTotal(o.items);},0);
  var h='<div class="sect"><h2>'+t("cancelledSect")+' · '+cx.length+' · <span class="num">'+money(sum)+'</span></h2></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>#</th><th>'+t("time")+'</th><th>'+t("table")+'</th><th>'+t("items")+'</th><th>'+t("reason")+'</th><th class="r">'+t("value")+'</th></tr></thead><tbody>';
  cx.forEach(function(o){
    h+='<tr class="cx"><td class="num">'+o.num+'</td><td class="num" style="white-space:nowrap">'+hm(o.sentAt)+'</td><td class="num">'+o.table+'</td><td>'+
      o.items.map(function(l){return l.qty+'× '+esc(snm(BY[l.id]||{en:l.id,ko:l.id}));}).join("<br>")+'</td><td>'+(o.reason?t("reasons")[o.reason]:"–")+'</td><td class="r num">'+money(linesTotal(o.items))+'</td></tr>';});
  return h+'</tbody></table></div></div>';
}
function vCancelModal(){
  var o=orders().filter(function(x){return x.id===S.cancelAsk;})[0];if(!o){S.cancelAsk=null;return "";}
  var items=o.items.map(function(l){return l.qty+'× '+esc(snm(BY[l.id]||{en:l.id,ko:l.id}));}).join(", ");
  var rs=t("reasons"),chips="";
  Object.keys(rs).forEach(function(k){chips+='<button class="rchip" data-act="creason" data-v="'+k+'" aria-pressed="'+(S.cancelReason===k)+'">'+rs[k]+'</button>';});
  return '<div class="scrim" data-act="stcancelno"><div class="modal cmodal" role="alertdialog" aria-modal="true" aria-label="'+esc(t("cancelQ")(o.num,o.table))+'">'+
    '<h3>'+esc(t("cancelQ")(o.num,o.table))+'</h3><div class="citems">'+items+' · <span class="num">'+money(linesTotal(o.items))+'</span></div>'+
    '<p>'+t("cancelInfo")+'</p>'+
    (o.printed?'<div class="cwarn">'+t("printedWarn")+'</div>':'')+
    '<div class="rq">'+t("reasonQ")+'</div><div class="reasons">'+chips+'</div>'+
    '<div class="actions"><button class="btn grow" data-act="stcancelno">'+t("keep")+'</button><button class="btn danger grow" data-act="stcancelyes" data-v="'+o.id+'">'+t("yesCancel")+'</button></div></div></div>';
}

/* ---------- Actions ---------- */
function toast(msg){document.querySelectorAll(".toast").forEach(function(x){x.remove();});var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function nextNum(){var d=today();return orders().filter(function(o){return dayOf(o.sentAt)===d;}).reduce(function(a,o){return Math.max(a,o.num);},0)+1;}
function update(id,fn){var l=orders();l.forEach(function(o){if(o.id===id)fn(o);});save(l);}
function findLine(k){return S.cart.filter(function(l){return l.key===k;})[0];}
function clone(o){return JSON.parse(JSON.stringify(o));}
function addLine(id,qty,opts){var k=keyOf(id,opts),ex=findLine(k);if(ex)ex.qty+=qty;else S.cart.push({key:k,id:id,qty:qty,opts:opts});}
function askPin(purpose,back){S.pin="";S.pinErr="";S.pinFor=purpose;S.pinBack=back;S.mode="pin";}

var actions={
  mode:function(v){S.mode=v;S.moving=null;},
  table:function(v){
    S.table=+v;
    if(S.moving){S.cart=S.moving;S.moving=null;S.mode=S.moveBack||"menu";toast(t("moved")(v));}
    else{S.cart=[];S.lang="en";S.cat="pho";S.mode="menu";}
    S._resetScroll=true;
  },
  cat:function(v){S.cat=v;S._resetScroll=true;},
  lang:function(v){S.lang=v;},
  slang:function(v){S.staffLang=v;try{localStorage.setItem(SL_KEY,v);}catch(e){}},
  cols:function(v){S.cols=+v;try{localStorage.setItem(COLS_KEY,v);}catch(e){}toast(t("colsToast")(v));},
  open:function(v){S.sheet={id:v,qty:1,opts:defaultOpts(v),editKey:null};},
  edit:function(v){var l=findLine(v);if(l)S.sheet={id:l.id,qty:l.qty,opts:clone(l.opts||defaultOpts(l.id)),editKey:l.key};},
  closesheet:function(){S.sheet=null;},
  opt:function(v,el){
    var g=el.getAttribute("data-g"),grp=optsFor(S.sheet.id).filter(function(x){return x.id===g;})[0];
    if(grp.type==="one")S.sheet.opts[g]=v;
    else{var a=S.sheet.opts[g],i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);}
  },
  sq:function(v){S.sheet.qty=Math.max(1,Math.min(20,S.sheet.qty+(+v)));},
  commit:function(){var sh=S.sheet;if(sh.editKey)S.cart=S.cart.filter(function(l){return l.key!==sh.editKey;});addLine(sh.id,sh.qty,sh.opts);S.sheet=null;},
  inc:function(v){var l=findLine(v);if(l)l.qty++;},
  dec:function(v){var l=findLine(v);if(l){l.qty--;if(l.qty<=0)S.cart=S.cart.filter(function(x){return x!==l;});}},
  rm:function(v){S.cart=S.cart.filter(function(l){return l.key!==v;});},
  ready:function(){if(S.cart.length)S.mode="lock";},
  backtomenu:function(){S.mode="menu";},
  topin:function(){askPin("confirm","lock");},
  changetable:function(){askPin("tables","menu");},
  unlockcancel:function(){S.mode=S.pinBack||"lock";S.pendingCancel=null;},
  key:function(v){
    if(v==="back"){S.pin=S.pin.slice(0,-1);S.pinErr="";return;}
    S.pinErr="";
    if(S.pin.length<4)S.pin+=v;
    if(S.pin.length===4){
      if(S.pin===PIN){S.pin="";S.pinErr="";
        if(S.pinFor==="tables"){S.moving=S.cart;S.moveBack="menu";S.mode="tables";}
        else if(S.pinFor==="cancel"){S.mode="station";S.cancelAsk=S.pendingCancel;S.pendingCancel=null;}
        else if(S.pinFor==="reopen"){S.mode="station";var tb;var all=orders();all.forEach(function(o){if(o.check&&o.check.id===S.pendingReopen){tb=o.table;delete o.check;}});save(all);S.pendingReopen=null;if(tb)toast(t("reopenedToast")(tb));}
        else S.mode="confirm";
      }else{S.pin="";S.pinErr="wrong";}
    }
  },
  movetable:function(){S.moving=S.cart;S.moveBack="confirm";S.mode="tables";},
  addmore:function(){S.mode="menu";},
  cancelorder:function(){S.cart=[];S.mode="tables";toast(t("cancelled")(S.table));},
  send:function(){
    if(!S.cart.length)return;
    var items=S.cart.map(function(l){return {id:l.id,qty:l.qty,opts:l.opts};});
    var now=Date.now(),o={id:"o"+now+Math.random().toString(36).slice(2,6),num:nextNum(),table:S.table,items:items,status:"sent",sentAt:now,printed:false};
    var list=orders();list.push(o);save(list);S.cart=[];S.mode="tables";toast(t("sent")(o.num,o.table));
  },
  print:function(v){S.ticket=v;},
  closeticket:function(){S.ticket=null;},
  markprinted:function(v){update(v,function(o){o.printed=true;});S.ticket=null;},
  done:function(v){update(v,function(o){o.status="done";o.doneAt=Date.now();});},
  reopen:function(v){update(v,function(o){o.status="sent";delete o.reason;delete o.cancelledAt;});},
  sttab:function(v){S.stTab=v;},
  taxsave:function(){var el=document.getElementById("taxrate"),r=el?parseFloat(el.value):NaN;
    if(isNaN(r)||r<0||r>20){toast(t("taxBad"));return;}
    S.taxRate=Math.round(r*1000)/1000;try{localStorage.setItem(TAX_KEY,String(S.taxRate));}catch(e){}toast(t("taxSaved")(S.taxRate));},
  printcheck:function(v){S.checkPrint=v;},
  closecheckprint:function(){S.checkPrint=null;},
  payask:function(v,el){S.payAsk={table:v,method:el.getAttribute("data-m")};},
  payno:function(){S.payAsk=null;},
  payyes:function(){
    var a=S.payAsk;S.payAsk=null;var list=checkGroups()[a.table]||[];if(!list.length)return;
    var sub=linesTotal(mergeItems(list)),tax=taxFor(sub),now=Date.now(),id="c"+now,ids={};list.forEach(function(o){ids[o.id]=1;});
    var all=orders();all.forEach(function(o){if(ids[o.id])o.check={id:id,method:a.method,at:now,sub:sub,tax:tax,total:sub+tax,rate:S.taxRate};});save(all);
    toast(t("closedToast")(a.table));
  },
  reopencheck:function(v){S.pendingReopen=v;askPin("reopen","station");},
  stcancel:function(v){S.pendingCancel=v;S.cancelReason=null;askPin("cancel","station");},
  creason:function(v){S.cancelReason=S.cancelReason===v?null:v;},
  stcancelno:function(){S.cancelAsk=null;S.cancelReason=null;},
  stcancelyes:function(v){var num;update(v,function(o){o.status="cancelled";o.cancelledAt=Date.now();o.reason=S.cancelReason||null;num=o.num;});S.cancelAsk=null;S.cancelReason=null;toast(t("cancelledToast")(num));},
  sound:function(){S.soundOn=true;beep();},
  today:function(){S.date=today();},
  sample:function(){
    var now=Date.now(),l=orders(),n=nextNum();
    var sets=[[{id:"brisket",qty:2,opts:{noodle:"reg",out:["cilantro"]}},{id:"egg",qty:1}],[{id:"oxtail",qty:1,opts:{noodle:"less",out:[]}},{id:"thaitea",qty:2}],
      [{id:"meatcombo",qty:1},{id:"chicken",qty:1,opts:{noodle:"reg",out:["onion","scallion"]}},{id:"summer",qty:1}],
      [{id:"jjam",qty:2},{id:"wings",qty:1}],[{id:"rare",qty:1,opts:{noodle:"reg",out:["sprouts"]}},{id:"beeffr",qty:1}],[{id:"superbowl",qty:1},{id:"chagio",qty:1},{id:"thaitea",qty:1}]];
    var tables=[3,7,5,9,1,10];
    sets.forEach(function(items,i){var ts=now-(sets.length-i)*14*60000;
      var so={id:"s"+ts+i,num:n+i,table:tables[i],items:items,status:i<3?"done":"sent",sentAt:ts,doneAt:i<3?ts+12*60000:null,printed:i<4,sample:true};
      if(i<2){var sb=linesTotal(items),tx=taxFor(sb);so.check={id:"cs"+ts+i,method:i===0?"card":"cash",at:ts+30*60000,sub:sb,tax:tx,total:sb+tx,rate:S.taxRate};}
      l.push(so);});
    save(l);toast(t("samplesAdded"));
  },
  clearsample:function(){save(orders().filter(function(o){return !o.sample;}));toast(t("samplesRemoved"));}
};

root.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act");
  /* tapping inside a dialog should not close it; only a tap on the dark backdrop itself does */
  if((t.classList.contains("scrim")||t.classList.contains("sheet-scrim"))&&e.target!==t)return;
  if(actions[a]){actions[a](t.getAttribute("data-v"),t);render();}
});
root.addEventListener("change",function(e){if(e.target.id==="rdate"){S.date=e.target.value||today();render();}});

var ctx=null;
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,0.18].forEach(function(d){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.2,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.15);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.16);});}catch(e){}}
S.lastSeen=openOrders().length;
window.addEventListener("storage",function(e){
  if(e.key!==KEY)return;
  var n=openOrders().length;if(n>S.lastSeen&&S.soundOn)beep();S.lastSeen=n;
  if((S.mode==="station"||S.mode==="report"||S.mode==="tables")&&!S.ticket)render();
});

render();
})();
</script>
